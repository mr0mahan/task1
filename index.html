<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <div class="left">

    <div class="image-box">
    <img src="img/Group 4.png" alt="">
    </div>

</div>
<div class="right">
    <div class="logo">
        <img src="img/Group 47602.png" alt="">
        <span>Your Logo</span>
    </div>
        <h1>Sign up</h1>
        <p class="subtitle">
        Let's get you all set up so you can access your personal account.
        </p>
        <form>

    <div class="row">

    <div class="input-box">
        <label>First Name</label>
        <input type="text" >
    </div>

    <div class="input-box">
        <label>Last Name</label>
        <input type="text" >
    </div>
</div>

    <div class="row">

    <div class="input-box">
      <label>Email</label>
        <input type="email" >
    </div>

    <div class="input-box">
        <label>Phone Number</label>
        <input type="number">
    </div>

</div>

<div class="input-box-password">

        <label>Password</label>

        <input type="password">

</div>

<div class="input-box-confrim-password">

        <label>Confirm Password</label>

        <input type="password">


</div>

<div class="checkbox">

    <input type="checkbox">

    <label>
    I agree to all the
    <a href="#">Terms</a>
    and
    <a href="#">Privacy Policies</a>
    </label>

</div>

    <button class="btn">
    Create account
    </button>

    <div class="login">
        Already have an account?

    <a href="#">Login</a>

</div>

            <div class="divider">

                 Or Sign up with 

            </div>
        </form>
    </div>
</div>
</body>
</html>
